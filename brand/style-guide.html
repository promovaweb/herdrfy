<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guia visual do Herdrfy</title>
    <link rel="icon" href="./logo/icon-32w.png" sizes="32x32">
    <link rel="stylesheet" href="./global.css">
    <style>
      body { margin: 0; background: var(--color-background); color: var(--color-text); font-family: var(--font-body); }
      main { margin: auto; max-width: 72rem; padding: 4rem 1.5rem; }
      h1, h2 { font-family: var(--font-heading); }
      .hero { align-items: center; display: grid; gap: 3rem; grid-template-columns: 1fr 1fr; min-height: 60vh; }
      .hero img { max-width: 100%; }
      .kicker { color: var(--color-accent); font-weight: 600; }
      .swatches { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); }
      .swatch { border: 1px solid var(--color-border); border-radius: 1rem; overflow: hidden; }
      .swatch div:first-child { height: 8rem; }
      .swatch p { margin: 0; padding: 1rem; }
      @media (max-width: 48rem) { .hero { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div>
          <p class="kicker">Painéis em grade</p>
          <h1>Herdrfy</h1>
          <p>Quatro painéis do Herdr; o magenta é o agente que você está acompanhando.</p>
        </div>
        <picture>
          <source srcset="./logo/logo-dark.svg" media="(prefers-color-scheme: dark)">
          <img src="./logo/logo-light.svg" alt="Logo do Herdrfy">
        </picture>
      </section>
      <h2>Paleta essencial</h2>
      <section class="swatches">
        <article class="swatch"><div style="background:#00161E"></div><p>Petróleo · #00161E</p></article>
        <article class="swatch"><div style="background:#2AD5BE"></div><p>Turquesa · #2AD5BE</p></article>
        <article class="swatch"><div style="background:#E0457B"></div><p>Magenta · #E0457B</p></article>
        <article class="swatch"><div style="background:#C42A63"></div><p>Magenta escuro · #C42A63</p></article>
        <article class="swatch"><div style="background:#F2F8F9"></div><p>Fundo claro · #F2F8F9</p></article>
      </section>
    </main>
  </body>
</html>
